name: Feature request
description: Suggest a user-centered improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      placeholder: Describe the commuter need without sharing personal trip details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Navo to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or trade-offs
    validations:
      required: false
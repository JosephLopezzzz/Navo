plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.navoalarmsounds'
version = '1.0.0'

android {
  namespace 'expo.modules.navoalarmsounds'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    testInstrumentationRunner 'expo.modules.navoalarmsounds.ImportedSoundSmokeTest'
  }
}
